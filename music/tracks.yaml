# Mood tags for each track in this music/ folder.
#
# The tags are guesses made from the track titles and YouTube's mood labels,
# not from listening to the tracks. Edit them freely if a track does not fit.
#
# verticals/music.py reads this file to pick a track whose tags overlap the
# niche's music.tags (for example, the science niche uses "cosmic", "ambient",
# "wonder", "cinematic" and "space"). Every .mp3 in this folder should have an
# entry here, and every entry should match a file in this folder.
#
# Each entry is either the plain tag list (as before: starts at 0 s, no gain
# change) or a mapping with these fields. The numbers are written by
# scripts/measure_music_tracks.py, which re-measures every track with ffmpeg
# ebur128 and rewrites this file. Re-run it if a track file changes.
#   tags        the mood tags above
#   steady_lufs loudness of the track's loud part (measured)
#   start_lufs  integrated loudness of the 3 s clip that playback hears from
#               start_at, measured on a clip cut at start_at (measured)
#   start_at    seconds into the track where playback starts, chosen so that
#               the 3 s from there are within 3 dB of steady (measured)
#   gain_db     gain that brings steady_lufs to the single target -16 LUFS
#               (computed; the target is a choice)
#   unusable    true means the track never reaches its steady loudness within
#               45 s. It has no start_at and is never picked.
#
# Which tracks a niche may pick is set by allowed_tracks in that niche's music
# block (for example niches/science.yaml). This file only holds the data for each
# track; it does not limit which tracks can be picked.

pulsar.mp3:
  tags: [cosmic, ambient, calm, space, wonder]
  steady_lufs: -10.7
  start_lufs: -13.7
  start_at: 16.6
  gain_db: -5.3
