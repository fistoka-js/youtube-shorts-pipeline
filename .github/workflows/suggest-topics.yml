name: Suggest topics

# Manual only. One LLM call (about 2 to 4 cents) writes 20 topic ideas as checkboxes, and the run
# opens a "Topic suggestions" issue with them. It changes no queue file and commits nothing.
on:
  workflow_dispatch: {}

# This run only reads the repository. It writes issues (issues: write) and nothing else.
permissions:
  contents: read
  issues: write

# Same group as produce.yml, so this run never overlaps a produce run.
concurrency:
  group: produce-queue
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERTICALS_SKILL_DIR: ${{ github.workspace }}/.verticals

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt -c constraints-ci.txt

      - name: Write API keys to config
        run: |
          mkdir -p .verticals
          python -c "
          import json
          from pathlib import Path
          config_path = Path('.verticals/config.json')
          data = json.loads(config_path.read_text()) if config_path.exists() else {}
          data['ANTHROPIC_API_KEY'] = '${{ secrets.ANTHROPIC_API_KEY }}'
          data['PEXELS_API_KEY'] = '${{ secrets.PEXELS_API_KEY }}'
          config_path.write_text(json.dumps(data, indent=2))
          "

      - name: Build the exclusion list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Topics from earlier topic-suggestion issues (any state) are excluded. Only the text of the
          # checklist lines is read; it is written to a file and never run as a command.
          if gh issue list --label topic-suggestions --state all --limit 100 --json body --jq '.[].body' > past-suggestion-bodies.txt; then
            sed -n 's/^- \[[ xX]\] \([^|]*\) | .*$/\1/p' past-suggestion-bodies.txt > topic-exclusions.txt || : > topic-exclusions.txt
          else
            echo "Could not list past topic-suggestion issues. Suggesting without an exclusion list."
            : > topic-exclusions.txt
          fi

      - name: Suggest topics
        # If this step fails, the run is red and no issue is created.
        run: |
          rm -f suggestions.md
          python -m verticals suggest --exclude-file topic-exclusions.txt --out suggestions.md
          test -f suggestions.md

      - name: Ensure the topic-suggestions label exists
        # A failure here (for example, the label already exists) never stops the run.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh label create topic-suggestions --description "Topic ideas suggested by the pipeline" --color 0E8A16 > /dev/null 2>&1; then
            echo "Created label topic-suggestions."
          else
            echo "Label topic-suggestions was not created (it may already exist)."
          fi

      - name: Create the topic suggestions issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          today=$(date -u +%F)
          TITLE="Topic suggestions $today"
          printf 'Topic ideas from the "Suggest topics" workflow, run on %s.\n\n' "$today" > issue-body.md
          cat suggestions.md >> issue-body.md
          if gh issue create --title "$TITLE" --body-file issue-body.md --assignee "$OWNER" --label topic-suggestions; then
            echo "Created issue \"$TITLE\", assigned to $OWNER."
          else
            echo "Creating the issue with assignee $OWNER failed. Retrying without an assignee."
            gh issue create --title "$TITLE" --body-file issue-body.md --label topic-suggestions
            echo "Created issue \"$TITLE\" without an assignee."
          fi
