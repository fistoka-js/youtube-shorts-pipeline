name: Produce video from queue

on:
  workflow_dispatch: {}   # manual trigger for now - schedule can be added later
  # schedule:
  #   - cron: "0 14 * * *"  # example: daily at 14:00 UTC, uncomment when ready

# The run commits and pushes queue changes back to the branch (contents: write), and the last step
# opens or closes the "Queue low: add topics" issue (issues: write).
permissions:
  contents: write
  issues: write

# One run at a time: a second run waits for the first to finish (including its
# commit and push) instead of overlapping. cancel-in-progress is false so a
# running upload is never cancelled.
concurrency:
  group: produce-queue
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERTICALS_SKILL_DIR: ${{ github.workspace }}/.verticals
      VARIATION_HISTORY_PATH: ${{ github.workspace }}/queue/variation_history.json

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          # Check out the branch head when this job starts, not the commit that
          # triggered the run, so a run waiting in the queue sees earlier queue/ commits.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          # Up to 3 attempts. Each attempt is capped at 4 minutes; if apt ignores the stop signal,
          # it is force-stopped 15 seconds later (sudo timeout runs as root, so it can stop apt).
          # Attempts 2 and 3 first point apt at the main Ubuntu archive (archive.ubuntu.com),
          # because the runner's Azure mirror was very slow on some days.
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 1 ]; then
              echo "ffmpeg install: attempt 1 of 3"
            else
              echo "ffmpeg install: attempt $attempt of 3 (trying to switch apt to archive.ubuntu.com)"
              # A killed attempt can leave dpkg half-configured; finish that first, capped at 60 seconds
              # (force-stopped 15 seconds later if it ignores the stop signal).
              # Failures are ignored.
              sudo timeout --kill-after=15 60 dpkg --configure -a || true
              # Point apt's sources files at the main Ubuntu archive instead of the Azure mirror.
              # Failures are ignored; the retry still runs.
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g; s|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources || true
            fi
            if sudo timeout --kill-after=15 240 bash -c 'apt-get update && apt-get install -y ffmpeg'; then
              echo "ffmpeg install: succeeded on attempt $attempt"
              exit 0
            fi
            echo "ffmpeg install: attempt $attempt failed or timed out"
            # Pause before the next attempt only (not after the last one).
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::ffmpeg install failed after 3 attempts"
          exit 1

      - name: Install Python dependencies
        run: pip install -r requirements.txt -c constraints-ci.txt

      - name: Restore Google client secret
        run: echo "${{ secrets.GOOGLE_CLIENT_SECRET_B64 }}" | base64 -d > client_secret.json

      - name: Restore YouTube OAuth token
        run: |
          mkdir -p .verticals
          echo "${{ secrets.YOUTUBE_TOKEN_B64 }}" | base64 -d > .verticals/youtube_token.json

      - name: Write API keys to config
        run: |
          mkdir -p .verticals
          python -c "
          import json
          from pathlib import Path
          config_path = Path('.verticals/config.json')
          data = json.loads(config_path.read_text()) if config_path.exists() else {}
          data['ANTHROPIC_API_KEY'] = '${{ secrets.ANTHROPIC_API_KEY }}'
          data['PEXELS_API_KEY'] = '${{ secrets.PEXELS_API_KEY }}'
          data['TAVILY_API_KEY'] = '${{ secrets.TAVILY_API_KEY }}'
          config_path.write_text(json.dumps(data, indent=2))
          "

      - name: Run queue orchestrator
        run: |
          # run.py commits a claim on the queue file before uploading, so it needs a git identity.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python run.py

      - name: Commit queue state changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/
          git diff --staged --quiet || git commit -m "Auto: queue state update from workflow run"
          # Rebase onto the branch head first, in case another run pushed while this one was working.
          git pull --rebase origin ${{ github.ref_name }}
          # Push the queue commit to the branch.
          git push

      - name: Warn if the queue is low
        if: always()
        # Never fails the run: a problem here only means no issue was opened or closed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Count the topic files waiting in queue/pending/ (only *.json; .gitkeep is not counted).
          count=0
          for f in queue/pending/*.json; do
            if [ -f "$f" ]; then count=$((count + 1)); fi
          done
          echo "Queue check: $count topic(s) pending in queue/pending/."
          TITLE="Queue low: add topics"
          LINK="https://github.com/$GH_REPO/blob/main/README.md#adding-topics-and-the-low-queue-issue"

          # Find the open issue with exactly this title. gh applies --jq itself, so no extra tool is needed.
          if ! open=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "Queue low: add topics") | .number'); then
            echo "Could not list open issues, so no issue was created or closed."
            exit 0
          fi
          number=$(printf '%s\n' "$open" | head -n 1)

          if [ "$count" -lt 3 ]; then
            if [ -n "$number" ]; then
              echo "Left alone: issue #$number \"$TITLE\" is already open."
              exit 0
            fi
            BODY="Only $count topic(s) are waiting in queue/pending/, and the minimum is 3. Add topics as described here: $LINK"
            if gh issue create --title "$TITLE" --body "$BODY" --assignee "$OWNER"; then
              echo "Created issue \"$TITLE\", assigned to $OWNER."
            else
              echo "Creating the issue with assignee $OWNER failed. Retrying without an assignee."
              if gh issue create --title "$TITLE" --body "$BODY"; then
                echo "Created issue \"$TITLE\" without an assignee."
              else
                echo "Could not create issue \"$TITLE\"."
              fi
            fi
          else
            if [ -n "$number" ]; then
              if gh issue close "$number" --comment "Closing automatically: $count topics are now pending in queue/pending/ (3 or more)."; then
                echo "Closed issue #$number: $count topics are pending."
              else
                echo "Could not close issue #$number."
              fi
            else
              echo "Nothing to do: $count topics are pending and no open \"$TITLE\" issue exists."
            fi
          fi